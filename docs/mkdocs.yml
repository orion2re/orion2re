site_name: Orion2 Redone Project
site_description: Documentation for the Master of Orion II restoration project
copyright: Orion2 Redone Team
docs_dir: content
site_dir: !ENV [ORION2RE_DOCUMENTATION_SITE_DIR, site]
use_directory_urls: false

watch:
  - content
  - hooks
  - ../specs/config
  - ../tools/config

theme:
  name: material
  favicon: assets/favicon.ico
  logo: assets/favicon.ico
  font: false
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top

plugins:
  - offline
  - search:
      lang: en
  - gen-files:
      scripts:
        - hooks/generated-reference.py

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/manual.css

extra:
  generator: false

nav:
  - Home: index.md
  - Manual:
      - manual/index.md
      - About version 2.00:
          - Introduction: manual/overview/introduction.md
          - Version 2.00 highlights: manual/overview/highlights.md
          - Compatibility: manual/overview/compatibility.md
          - File locations: manual/overview/file-locations.md
          - Critical bug fixes: manual/overview/critical-bug-fixes.md
          - Multiplayer: manual/multiplayer.md
      - User-facing changes:
          - manual/user-facing-changes/index.md
          - Interface and display: manual/user-facing-changes/interface.md
          - Galaxy setup: manual/user-facing-changes/galaxy-setup.md
          - Gameplay changes: manual/user-facing-changes/gameplay.md
          - Build queue management: manual/user-facing-changes/build-queue.md
      - Using mods:
