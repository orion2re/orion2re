          - Starting conditions and difficulty: manual/game-mechanics/starting-conditions.md
          - Colonies and production: manual/game-mechanics/colonies-and-production.md
          - Research and technology: manual/game-mechanics/research-and-technology.md
          - Leaders: manual/game-mechanics/leaders.md
          - Ship refitting: manual/game-mechanics/ship-refitting.md
