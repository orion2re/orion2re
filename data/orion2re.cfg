# Orion2 Redone configuration. Edit this file to customize your game.
# Uncomment any of these examples to enable them:
# interface scaler = hq3x;
# interface vsync_enabled = true;
# enable v150i;
# See the configuration manual for more settings and available mods.

# Startup display settings. Restart the game after changing these values.
# Window dimensions do not change the internal 640x480 game resolution.
interface window_width = 640;
interface window_height = 480;
interface fullscreen = false;

# Set to true to restore the thank-you dialog on normal exit.
interface show_exit_message = false;

# Optional local RPC (requires ORION2RE_ENABLE_RPC at build time; restart required).
# Set a private rpc_key before enabling; the connecting client supplies the same key.
# interface rpc_key = "replace-with-your-private-key";
# interface rpc_port = 17362;
# interface rpc_enabled = true;

# This is a community-maintained router for online multiplayer.
interface router = "209.38.39.19";