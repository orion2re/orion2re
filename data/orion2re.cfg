# [ ORION2 REDONE CONFIGURATION                       ]
# [ ================================================= ]
# [ Edit this file to customize your game.            ]
# [ Configuration executes top to bottom.             ]
# [ Put overrides after the relevant enable.          ]
# [ Later independent enables have higher priority;   ]
# [ repeating enable does not reset settings.         ]


# [ SELECT YOUR MOD                                   ]
# [ ================================================= ]
# [ Uncomment one line to enable a mod.               ]
# [ See the configuration manual for more settings    ]
# [ and available mods.                               ]

    enable v150;
    # enable v150i;
    # enable v150i-mp;
    # enable ice;
    # enable ice-x;
    # enable vdc-gm3;


# [ STARTUP DISPLAY SETTINGS                          ]
# [ ================================================= ]
# [ Restart the game after changing these values.     ]
# [ Window dimensions do not change the internal      ]
# [ 640x480 game resolution.                          ]

    interface window_width = 640;
    interface window_height = 480;
    interface fullscreen = false;
    # interface scaler = hq3x;
    # interface vsync_enabled = true;
    interface show_exit_message = false;


# [ MULTIPLAYER                                       ]
# [ ================================================= ]
# [ This is a community-maintained router for         ]
# [ online multiplayer games.                         ]

    interface router = "209.38.39.19";

