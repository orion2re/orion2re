# ===================
# basic configuration
# ===================

# Package name, identity, class, order, and description are defined in mod.json5.

interface vsync_enabled            = false;       # Faster screen changes and animations.
interface screen_fade_speed        = 100;         # Fade in and fade out speeds for switching screens.
interface maximum_galaxy_zoom_mode = classic;     # Keeps the classic 72-star-style zoom scales.
interface main_menu_mod_list       = true;        # Displays loaded mods in the Opening screen. Credits in separate screen.
interface main_screen_tax_rate     = true;        # Displays non-zero tax percentage in Main screen.
interface print_research_value     = percentage1; # Percentage chance for breakthrough is shown in Colonies screen.
interface warn_blockers            = false;       # No warning for Housing, Trade Goods, or repeat builds in queue.
interface history_graph_smoothing  = false;       # If false, history graphs are not smoothed.
interface sort_serious_turn_summary_first = true; # Serious reports on top in turn summary.

design design_button_shield        = intact;      # Choice of shield remains intact.
design design_button_computer      = intact;      # Choice of computer remains intact.
design clear_button_shield         = update;      # Shield is updated to best.
design clear_button_computer       = update;      # Computer is updated to best.
design missile_default_x2_rack     = true;        # Default missile ammo in Ship Design dock is x2 instead of x5.

leaders leader_dies_with_no        = true;        # A leader always shouts "nooo" if his ship is destroyed.
interface animation cloak_steps    = normal: 2
                                     fast:   4;   # Faster cloak animation for normal and fast animations.

colony housing_creates_no_farmers  = true;        # New population from Housing is never assigned to farming.
research keep_research_on_finds    = true;        # Retains RPs when current tech app being researched is acquired
                                                  # by non-research means such as artifacts, spying, or capture.

events event_delay comet              = 150;      # 200
events event_delay supernova          = 150;      # 200
events event_delay time_space_anomaly = 150;      # 50

# END

