# ==================================
# improved-multiplayer configuration
# ==================================

# Package name, identity, class, order, and description are defined in mod.json5.
# Lua entry points are declared by the package manifest and main.lua.
# Mod-specific legacy assets are provided as per-entry VFS overrides under ../data.

# COMBAT.LBX          inherited from v150i.
# DESIGN.LBX          inherited from v150i.
# SHIPNAME.LBX        inherited from v150i.
# HERODATA.LBX        inherited from v150i.
# HELP.LBX            inherited from v150i.
# TECHDESC.LBX        inherited from v150i.
# KENTEXT.LBX         to be omitted here (it's for the single-player -12-pick replacement).

# AIRACES.CFG         inherited from v150i.
# AISHIPS.CFG         inherited from v150i.
# ANTS.CFG            inherited from v150i.
# BLDLIST.CFG         inherited from v150i.
# TWEAKS.CFG          inherited from v150i.
include PICKS_MP.CFG; # Multiplayer race picks.
include MAP.CFG;      # Multiplayer map.
# MIRROR_HW           is declared as a package dependency.

# DEPOSITS.LUA        inherited from v150i.
# TECHTREE.LUA        inherited from v150i.

diplomacy noreport = true;                     # Forbids Report button and Exchange/Demand/Offer Technology.
interface confirm_battle_message_timeout = 90; # Timeout for disappearance of following confirmation messages
                                               # in Multiplayer: 'X attacks Y at Z', 'outpost destroyed' and
                                               # 'colony captured by mind control'. Timeout is in ticks.
                                               # Timeout for combat confirmation messages (90 =~5 seconds).
combat boarding auto_close_results = true;     # Raid and capture result pop-ups timeout automatically.

# END

