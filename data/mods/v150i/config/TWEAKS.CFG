## MICRO MANAGEMENT
colony first_pop_to_production = true;                   # first pop on a new colony always becomes a worker.
colony new_farmer_food_threshold = 3;                    # base food/farmer above which a new-pop is assigned to farming.
colony housing_creates_no_farmers = true;                # new-pop on housing colony is never assigned to farming.
design rebuild_ship_designs_after_field physics = false; # no auto ship design rebuild when the Physics field is given.

## AI
ai colony_bases_prewarp = true;                          #         ai is more likely to build c.bases during pre-warp phase.
ai tech_priority double_field_2 = astro_biology;         # 73      astro biology instead of xeno relations.
ai ai_hypertech_threshold adv_biology = 0 0 1 0 1 0 0;   #         ai techs hyper-advanced L1 physics and fields
ai income_bonus impossible = 4;                          # 3       ai gets +1 BC instead of +3/4 BC per pop on impossible.
ai uncolonized_planet_special_worth gold_deposits = 320; # 1280
ai uncolonized_planet_special_worth gem_deposits  = 640; # 2560

## MONSTERS
events event_delay space_amoeba = 100;                   # 100     unchanged
events event_delay space_eel = 125;                      # 150     25 turns earlier
events event_delay space_crystal = 150;                  # 200     50 turns earlier
events event_delay space_hydra = 175;                    # 250     75 turns earlier
events event_delay space_dragon = 200;                   # 300     100 turns earlier
ai monsters_stay_chance = 10;                            #   2     81% chance to stay after combat; default is 25% chance.
ai max_eels = 8;                                         # can be 8 instead of 4 eels in the galaxy at the same time.
ai eel_spawn_frequency = 20;                             # eels produce offspring every 20 turns instead of 30.
combat amoeba_regeneration = true;                       # amoebae have 20% regeneration each combat turn.
combat crystal_keep = true;                              # crystal keeps captured ships as part of own fleet after combat.
ships monster hit_points system_dragon = 600;            # 100 extra hit points.
ships monster hit_points event_hydra = 2000;             # 500 extra hit points.
ships monster hit_points event_dragon = 3000;            # 500 extra hit points.
ships crystal system weapons 1 amount = 2;               # one extra ray
ships crystal event weapons 1 amount = 2;                # one extra ray
ships crystal shared special = warp_dissipator;          # warp dissipator
ships amoeba system weapons 2 = anti_matter_bomb all_sectors none 10  2; # system amoeba has 2 anti-matter bombs as 2nd weapon.
ships dragon system weapons 1 = dragon_breath    all_sectors none  0  1; # dragon breath
ships dragon system weapons 2 = phasor_eye       all_sectors pd    0  8; # phasor eye
ships dragon event  weapons 1 = dragon_breath    all_sectors ovr   0  1; # dragon breath
ships dragon event  weapons 2 = dragon_breath    all_sectors ovr   0  1; # one extra dragon breath
ships dragon event  weapons 3 = phasor_eye       all_sectors pd    0 20; # phasor eye

## GUARDIAN & AVENGER
ships guardian shield = class_vii;                                       # class VII shield instead of class V.
ships guardian weapons 3 = spatial_compressor all_sectors none 0 2;      # spatial compressor weapon slot 3 instead of 5.
ships guardian weapons 5 = plasma_torpedo all_sectors env,eccm,ovr 0 1;  # plasma torpedo     weapon slot 5 instead of 3.
ships avenger weapons 1 = death_ray forward hv 0 2;                      # death ray (hv)     slot 1 instead of 2.
ships avenger weapons 2 = particle_beam forward hv 0 4;                  # particle beam (hv) slot 2 instead of 1.
ships avenger weapons 3 = particle_beam forward none 0 10;               # particle beam (reg)
ships avenger weapons 5 = particle_beam design_360 pd 0 10;              # particle beam (pd) 360 degr.

## EVENTS
