## COMBAT RULES
combat ship_initiative = 2;                            # ships can wait 1x per turn. post-wait reverse order initiative.
combat interactive_combat_stats = true;                # ships stats update *within* the combat turn, as soon as any event
                                                       # affecting them occurs. With ICS enabled, each ship's initiative
                                                       # rating may also change during the combat turn, affecting ship
                                                       # ordering instantly. Refer to the 1.50 Manual for more info.
combat defensive_fire = true;                          # regular mount beams fire automatically against approaching ships.
combat alternate_defensive_fire = true;                # alternate DF uses static values.
combat alternate_defensive_fire_range = 100 0 0 0 0 0 0 0; # DF only activates at range 1.
combat simplified_beam_formula = true;                 # ranges 6+ lower accuracy, high ba-bd doesn't ignore range penalty.
combat ranged_to_hit_penalty 6 = -50 -65 -80;          # accuracy penalty lowered for r6-r8 (was -55,-70,-85).
combat planet_non_enveloping = true;                   # env mod (fusion, plasma, torps) is ineffective against planets.
combat missile_initiative = 0;                         # missiles and torpedoes move at the end of each turn.
combat missile_cross_round_merge = false;              # missiles launched in different turns will not glue together.
combat board_range normal = 1;                         # ships boarding range is 1 square (classic range is 3).
combat boarding raid_items_per_marine = 1;             # 2       number of things that a successful marine can damage.
combat telepathic_multiple_capture = true;             # tele can control ship after recapture from non-tele opponent.
combat kill_excess_marines_after_capture = true;       # a ship's troop capacity is no longer exceeded after its capture.
combat capitol_can_be_bombed = true;                   # capitol is a regular building and can be destroyed by bombardment.
combat human_fleet_auto_retreat = true;                # in auto combat, human fleets retreat according ai rules.

