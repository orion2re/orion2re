events event_delay hyperspace_flux = 100;       #   50    global event
events event_delay warp_beast = 100;            #   50    global event
events event_delay comet = 150;                 #  200    local event
events event_delay supernova = 150;             #  200    local event
events event_delay time_space_anomaly = 150;    #   50    local event
events duration anomaly_chance = 10;            #   20    10% chance to stop each turn instead of 5% (100/x).
events duration anomaly_min = 2;                #    4    minimum duration is 4 turns instead of 6 (x+2).
events duration beast_min = 2;                  #    4    minimum duration is 4 turns instead of 6 (x+2).
events duration flux_min = 2;                   #    4    minimum duration is 4 turns instead of 6 (x+2).
events supernova minimum_research_per_turn = 1; #    0    fixes issue of 0 rp colony remedying nova next turn.
events pirate_raid random_percent = 16;         #   21    result can now be 1-16 instead of 1-21.
events pirate_raid fixed_percent = 9;           #   29    so in result min 10% (30%) and max 25% (50%).

