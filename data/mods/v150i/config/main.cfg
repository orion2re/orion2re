# ======================
# improved configuration
# ======================

# Package name, identity, class, order, and description are defined in mod.json5.
# Lua entry points are declared by the package manifest and main.lua.
# Mod-specific legacy assets are provided as per-entry VFS overrides under ../data.

# COMBAT.LBX          provides the greyed Wait button used by the initiative rules.
# DESIGN.LBX          provides the x3 missile-rack artwork.
# SHIPNAME.LBX        provides modified ship names.
# HERODATA.LBX        provides modified tactics leaders in every supported language.
# HELP.LBX            provides updated English text.
# TECHDESC.LBX        provides updated English text.
# KENTEXT.LBX         provides the -12 negative-picks text.

include AIRACES.CFG;  # Improved AI race designs.
include AISHIPS.CFG;  # Improved AI ship designs.
include ANTS.CFG;     # Updated Antaran ship designs.
include BLDLIST.CFG;  # Adjusted buildings list order.
include TWEAKS.CFG;   # Game rule tweaks.
include PICKS_SP.CFG; # Single-player race picks.
include MAP.CFG;      # Single-player map.
# MIRROR_HW           # Declared as a package dependency only for improved-multiplayer.

# DEPOSITS.LUA        upgrades (ultra)poor planets with gold/gem deposits.
# TECHTREE.LUA        modifies the technology tree for Uncreative races.

diplomacy noreport = false;                     # Allows Report button and Exchange/Demand/Offer Technology.
interface confirm_battle_message_timeout = 900; # Timeout for disappearance of following confirmation messages
                                                # in Multiplayer: 'X attacks Y at Z', 'outpost destroyed' and
                                                # 'colony captured by mind control'. Timeout is in ticks.
                                                # Timeout for combat confirmation messages (900 =~50 seconds).
combat boarding auto_close_results = false;     # If true, raid and capture result pop-ups timeout automatically.

# END

